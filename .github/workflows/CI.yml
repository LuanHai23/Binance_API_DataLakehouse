name: Binance Lakehouse CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.16.0"

jobs:
  python:
    name: Python unit tests and YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-producer.txt

      - name: Install producer and YAML dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --requirement requirements-producer.txt \
            PyYAML==6.0.3

      - name: Check Python syntax
        run: |
          python -m compileall -q kafka_producer scripts dags tests

      - name: Run producer unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate tracked YAML files
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          import yaml

          raw_paths = subprocess.check_output([
              "git",
              "ls-files",
              "-z",
              "--",
              "*.yml",
              "*.yaml",
          ])

          paths = [
              Path(os.fsdecode(item))
              for item in raw_paths.split(b"\0")
              if item
          ]

          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"YAML=PASS {path}")

          print(f"YAML_VALIDATION=PASS FILE_COUNT={len(paths)}")
          PY

      - name: Validate rendered GCP Workflow
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          silver = Path(
              "infra/terraform/workflows/silver_batch.yaml"
          ).read_text(encoding="utf-8")
          audit_helper = Path(
              "infra/terraform/workflows/run_audit.yaml"
          ).read_text(encoding="utf-8")
          gold_sql = Path(
              "sql/gcp_gold/fact_market_candles_1m_merge.sql"
          ).read_text(encoding="utf-8")
          audit_sql = Path(
              "sql/gcp_ops/upsert_pipeline_run.sql.tftpl"
          ).read_text(encoding="utf-8")

          audit_sql = (
              audit_sql
              .replace("${PROJECT_ID}", "validation-project")
              .replace("${OPS_DATASET}", "binance_ops_validation")
          )

          rendered = "\n".join([silver, audit_helper])
          rendered = rendered.replace(
              "__GOLD_MERGE_QUERY_JSON__",
              json.dumps(gold_sql),
          )
          rendered = rendered.replace(
              "__RUN_AUDIT_QUERY_JSON__",
              json.dumps(audit_sql),
          )

          if "__GOLD_MERGE_QUERY_JSON__" in rendered:
              raise RuntimeError("Gold SQL placeholder was not rendered")
          if "__RUN_AUDIT_QUERY_JSON__" in rendered:
              raise RuntimeError("Run-audit SQL placeholder was not rendered")

          document = yaml.safe_load(rendered)
          expected = {"main", "submit_batch", "write_run_audit"}

          if not expected.issubset(document):
              raise RuntimeError("Rendered Workflow definitions are incomplete")

          print("RENDERED_GCP_WORKFLOW=PASS")
          PY

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize Terraform without backend
        run: |
          terraform -chdir=infra/terraform init \
            -backend=false \
            -input=false \
            -lockfile=readonly \
            -no-color

      - name: Validate Terraform configuration
        run: |
          terraform -chdir=infra/terraform validate -no-color

  dbt:
    name: Parse dbt project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt adapter
        run: |
          python -m pip install --disable-pip-version-check \
            dbt-core==1.10.23 dbt-postgres==1.10.0

      - name: Install dbt packages
        working-directory: binance_analytics
        run: dbt deps --profiles-dir .

      - name: Parse dbt project without warehouse access
        working-directory: binance_analytics
        run: |
          dbt parse \
            --profiles-dir . \
            --no-partial-parse
